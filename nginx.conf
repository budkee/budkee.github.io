# /etc/nginx/nginx.conf
user nginx;
worker_processes auto;  # ou um número como 2

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024; # Uma regra prática comum é configurar a quantidade de workers igual ao número de núcleos de CPU disponíveis no container. Isso porque cada worker process do NGINX é single-threaded, então, em geral, ter um processo por núcleo maximiza o uso da CPU.
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://jekyll_server:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
