# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values which you are expected to set up once and rarely edit after that. If you find yourself editing this file very often, consider using Jekyll's data files feature for the data you need to update frequently.

# For technical reasons, this file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# If you need help with YAML syntax, here are some quick references for you:
#   https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
#   https://learnxinyminutes.com/docs/yaml/

# Site settings
# These are used to personalize your new site. If you look in the HTML files, you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.

# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Cálculo de Indexação Semântica Latente
lsi: false
# Desativa plugins inseguros
safe: true
# Recompila a cada alteração
incremental: true

# Configuração do destaque de sintaxe para o Rouge
highlighter: rouge

# Configuração do GitHub Gist
# 'noscript: false' indica o JavaScript para exibir os Gists que serão carregados, o que permite que os Gists sejam exibidos corretamente se o JavaScript estiver habilitado
gist:
  noscript: false

# Configurações do Kramdown, um parser de Markdown usado para processar arquivos Markdown
kramdown:
  # Define o motor de matemática a ser usado para renderizar equações matemáticas no Markdown
  math_engine: mathjax

  # Define o destaque de sintaxe para o Kramdown, que será usado para colorir o código
  syntax_highlighter: rouge

# --------------------------- Geral do site ---------------------------
title: Meu Portfólio
subtitle: by Kaê
email: contato@budkee.me
description: >- # this means to ignore newlines until "baseurl:"
  Bem-vinde ao meu portfólio de projetos pessoais. Aqui você pode ver um pouco do quê e do como desenvolvo meus projetos. Também escrevo sobre alguns problemas que passei e passo ao ter que lidar a minha stack, tanto tecnológica como de gestão. 
url: "https://budkee.github.io" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
# domain: budkee.me

city: Campo Grande
state: MS
zip_code: 79060300
country: Brasil


# Homepage tiles
tiles-source: pages # accepts "posts" or "pages"
tiles-count: 6

# Social settings (key must match name of font awesome icon)
# see https://fontawesome.com/icons?d=gallery&p=2&s=brands
# Icons are not shown if value is empty
# You need to restart jekyll for changes to have an effect
socials:
  GitHub: https://github.com/budkee 
  Instagram: https://www.instagram.com/budke_/
  LinkedIn: https://www.linkedin.com/in/kaebudke/

# Build settings
markdown: kramdown
# theme: minima
plugins:
  - jekyll-feed
  - Jekyll-seo-tag
sass:
  style: compressed
github:
  token: false


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to the internal "default list".

# Excluded items can be processed by explicitly listing the directories or their entries' file path in the `include:` list.

exclude:
  - "*.gemspec"
  - LICENSE.md
  - CONTRIBUTING.md
  - README.md 
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
