    <main>
      
      <div class="card p-4 mt-4" style="width: 40rem; margin: auto;">

          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-circle mx-3" viewBox="0 0 16 16" >

        </div>

        <div class="card-body" >
          
          <form action="#" class="justify form-control">
            <div class="col-sm d-grid m-3">
              <button type="button" class="btn btn-dark p-2">Entrar com o Google <i class="bi bi-google" style="padding-left: 10px;"></i> </button> 
            </div>
            <div class="container-fluid">
              <div class="row">
                <div class="col-sm my-5">
                  
                  <div class="mb-4">
                    <label for="email">Login</label>
                    <input type="email" class="form-control" id="email" placeholder="Insira seu e-mail" name="email">
                  </div>
              
                  <div class="mb-4">
                    <label for="pwd">Senha</label>
                    <input type="password" class="form-control" id="pwd" placeholder="Senha" name="pswd">
                  </div>
              
                  <div class="mb-3 form-check">
                    <label class="form-check-label ">
                    <input class="form-check-input" type="checkbox" name="remember"> Lembrar de mim
                    </label>
                  </div>
              
                  <button type="submit" class="btn btn-dark">Salvar</button>

                </div>
                
              </div>  
            </div>  
          </form>
