  <main>

    
    <div class="card p-4 mt-4" style="width: 50rem; margin: auto;">

      <div class="card-title" style="display: flex; justify-content: center;">      
        
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-file-person mx-4" viewBox="0 0 16 16">
          <path d="M12 1a1 1 0 0 1 1 1v10.755S12 11 8 11s-5 1.755-5 1.755V2a1 1 0 0 1 1-1h8zM4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H4z"/>
          <path d="M8 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        </svg>

        <h2 class="card-title" >Faça seu cadastro</h2>
      
      </div>
      
      <div class="card-body">
        
        <form action= "#" class="justify form-control">
          <div class="container-fluid">
            <div class="col-sm d-grid m-3">
                <button type="button" class="btn btn-dark p-2">Cadastrar com o Google <i class="bi bi-google" style="padding-left: 10px;"></i> </button> 
            </div>
            <div class="row">
               
              <div class="col-sm-6">
                <div class="form-check my-5 mx-5">
                  <input type="checkbox" name="solucionador" id="soluc"></input>
                  <label class="form-check-label">Cadastro com CPF</label>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="form-check my-5 mx-5">  
                  <input type="checkbox" name="solicitante" id="solic"></input>
                  <label class="form-check-label">Cadastro com CNPJ</label>
                </div>
              </div>
            </div>
            
            <div class="row">
              <div class="col-sm">
                <div class="mb-3">
                  <label for="nome">Nome completo</label>
                  <input type="text" class="form-control" placeholder="Nome completo" id="nomeid" onChange="setNome()">
                </div>
                <div class="mb-3">
                  <label for="email">E-mail</label>
                  <input type="email" class="form-control" placeholder="Email" id="emailid" onChange="setEmail()">
                </div>
                <div class="mb-3">
                  <label for="pwd">Senha</label>
                  <input type="password" class="form-control" id="pwd" placeholder="Senha" name="pswd">
                </div>
                <div class="mb-3">
                  <label for="pwd">Confirme a senha</label>
                  <input type="password" class="form-control" id="pswd2" placeholder="Insira a senha novamente" name="pswd2">
                </div>
                <div class="mb-3">
                  <label for="telefone">Celular </label>
                  <input type="tel" class="form-control" placeholder="+55 (xx) 9xxxx-xxxx" id="telid" onChange="setTelefone()"></input>
                </div>
              </div>

              <div class="mb-3 form-check">
                <label class="form-check-label">
                <input 
                  type="checkbox"
                  class="form-check-input"
                  name="lembrar senha"> Lembrar senha 
                </label>
              </div>
            <button type="submit" class="btn btn-dark ">Salvar</button>
        </form>
      </div>  
      </div>
    </div>   
    </div>
  </main>
  <section class="split">
    <br>
  </section>
  <footer class="text-center text-white" style="background-color: #000000cd;">

    <div class="container pt-4">

      <section class="mb-4">

        <a
          class="btn btn-link btn-floating btn-lg text-light m-1"
          href="#!"
          role="button"
          data-mdb-ripple-color="dark"
          ><i class="bi bi-facebook"></i
        ></a>
  
        <!-- Google -->
        <a
          class="btn btn-link btn-floating btn-lg text-light m-1"
          href="#!"
          role="button"
          data-mdb-ripple-color="dark"
          ><i class="bi bi-google" style="color: rgb(255, 255, 255);"></i
        ></a>
  
        <!-- Instagram -->
        <a
          class="btn btn-link btn-floating btn-lg text-light m-1"
          href="#!"
          role="button"
          data-mdb-ripple-color="dark"
          ><i class="bi bi-instagram"></i
        ></a>
  
        <!-- Linkedin -->
        <a
          class="btn btn-link btn-floating btn-lg text-light m-1"
          href="#!"
          role="button"
          data-mdb-ripple-color="dark"
          ><i class="bi bi-linkedin"></i
        ></a>
      </section>
      <!-- Section: Social media -->
