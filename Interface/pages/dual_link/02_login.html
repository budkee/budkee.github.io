  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
      <link rel="stylesheet" href="design.css">
      <link rel="shortcut icon" href="/Imagens/favicon_branco_dl/favicon.ico" type="image/x-icon">
      <title>Dual Link</title>
  
  </head>
  
  <body>
    <h1>Menu do Site</h1>
      <ul>
        <li></li>
      </ul>
    <div class="header">
      <h1>Conectando soluções</h1>
  
    </div>  
    <div id="login">
      <form class="card">
        <div class="card-header">
          <h2> Login</h2>
        </div>
        <div class="card-content">
          <div class="card-content-area">
            <label for="usuario"> Usuário</label>
            <input type="text" name="nome" id="usuario" autocomplete="off">
          </div>
          <div class="card-content-area">
            <label for="senha"> Senha </label>
            <input type="senha" id="senha" autocomplete="off">
          </div>
        </div>
        <div class="card-footer">
          <input type="submit" value="Entrar" class="submit">
          <a href="#" class="recuperar_senha"> Esqueceu a senha?</a>
        </div>
      </form>


      <form onsubmit="gravar">
        <!-- > em teste <input type="text" placeholder="Nome" onChange={event => setNome(event.target.value)}></input> -->
        <input type="text" placeholder="Nome" id="nomeid" onChange="setNome()"></input>
        <input type="email" placeholder="Email" id="emailid" onChange="setEmail()"></input>
        <input type="tel" placeholder="Telefone" id="telid" onChange="setTelefone()"></input>
        <textarea placeholder="Observações" id="observacoesid" onChange="setObservacoes()"></textarea>
        <button type="submit">Salvar</button>

      </form>


    </div>

    
    <!--<script type="module" src="./js/firebase.js"></script>
    <script type="module" src="./js/user_database.js"></script>-->
    <script type="module" src="../js/index.js"></script>


  
  </body>
  
  </html>
