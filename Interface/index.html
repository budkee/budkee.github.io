<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <title> siriusb.udke | Home</title>
</head>
<body>
    <header> 
        <h1>Home</h1>
        <nav> <!-- barra de navegação -->
            <ul> <!-- unordered list -->
                <a href="../pages/alexandria.html">Alexandria</a> |   
                <a href="../pages/projetos-web.html">Desenvolvimento Web</a> |   
                <a href="../pages/projetos-ds.html">Data Science</a> |   
            </ul>
        </nav>
    </header>
    <body>
        <section id="conteudo"></section>
    </body>
    <footer> <!-- rodapé -->
        <p>Copyright 2023</p>
    </footer>
    <script>
        document.querySelectorAll('a').forEach(link => {
            const conteudo = document.getElementById('conteudo')

            link.onclick = function(e) {
                e.preventDefault()
                fetch(link.href)
                    .then(resp => resp.text())
                    .then(html => conteudo.innerHTML = html)
            }
        })
    </script>

    
</body>
</html>
